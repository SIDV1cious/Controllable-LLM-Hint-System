name: Code Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff static analysis
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Python compile check
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          ignored_parts = {"node_modules", "component-template", "__pycache__"}
          for path in Path(".").rglob("*.py"):
              if ignored_parts.intersection(path.parts):
                  continue
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Run tests
        run: pytest -q

  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: streamlit-component-x/streamlit_component_x/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: streamlit-component-x/streamlit_component_x/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MathLive component
        run: npm run build
